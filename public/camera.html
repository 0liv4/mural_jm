<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara Mural JM</title>

    <style>
        
        body { 
            margin: 0; 
            background: #121212; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }
        
        video { 
            width: 90%; 
            max-width: 500px; 
            border-radius: 15px; 
            background: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        button {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: #e63946;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
        }

        button:active {
            transform: scale(0.95); 
        }
    </style>
</head>
<body>

    <video id="videoCamara" autoplay playsinline></video>
    <button id="btnCapturar">Hacer foto</button>
    <canvas id="lienzoFoto" style="display: none;"></canvas>

    <script src="js/camera.js"></script>
</body>
</html>
