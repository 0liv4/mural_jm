<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pantalla Mural en Directo</title>
    <style>
        
        body { margin: 0; background: #000; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: Arial;}
        canvas { max-width: 100%; max-height: 100%; box-shadow: 0 0 20px rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>

    <h2 id="mensaje">Conectando con el escenario...</h2>
    
    
    <canvas id="muralCanvas" width="1280" height="720" style="display: none;"></canvas>

    <script>
        const canvas = document.getElementById('muralCanvas');
        const ctx = canvas.getContext('2d');
        const mensaje = document.getElementById('mensaje');

        function actualizarMural() {
            
            fetch('../api/get-photos.php')
                .then(respuesta => respuesta.json()) 
                .then(listaDeFotos => {
                    
                    if (listaDeFotos.length > 0) {
                       
                        const indiceAleatorio = Math.floor(Math.random() * listaDeFotos.length);
                        const fotoElegida = listaDeFotos[indiceAleatorio];

                        
                        const img = new Image();
                        
                        img.src = '../uploads/event_1/' + fotoElegida;
                        
                        img.onload = () => {
                            mensaje.style.display = 'none'; 
                            canvas.style.display = 'block'; 
                            
                            
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        };
                    } else {
                        mensaje.innerText = "Esperando las primeras fotos del público...";
                    }
                })
                .catch(error => {
                    console.error("Error conectando con la base de datos:", error);
                });
        }

        
        actualizarMural();

       
        setInterval(actualizarMural, 5000);
    </script>
</body>
</html>
