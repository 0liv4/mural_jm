<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Canvas Ejemplo 2</title>
</head>
<body>
    <h2>Ejemplo 2: Redimensionar Imagen a 800x800</h2>
    <!-- Canvas de 800x800-->
    <canvas id="canvasRedimensionado" width="800" height="800" style="border:2px dashed rgb(73, 207, 20); max-width: 100%;"></canvas>

    <img id="fotoGrande" src="https://picsum.photos/1200/1000" style="display: none;" alt="Foto grande">

    <script>
        window.onload = function() {
            const canvas = document.getElementById('canvasRedimensionado');
            const ctx = canvas.getContext('2d');
            const img = document.getElementById('fotoGrande');

           
            ctx.drawImage(img, 0, 0, 800, 800);
        };
    </script>
</body>
</html>
