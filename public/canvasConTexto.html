<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Canvas Ejemplo 2 con Texto</title>
</head>
<body>
    <h2>fotoConTexto</h2>
    
    
    <canvas id="canvasRedimensionado" width="800" height="800" style="border:2px dashed rgb(73, 207, 20); max-width: 100%;"></canvas>

    
    <img id="fotoGrande" src="JaviMarco.jpg" style="display: none;" alt="Nuestra foto">

    <script>
        window.onload = function() {
            const canvas = document.getElementById('canvasRedimensionado');
            const ctx = canvas.getContext('2d');
            const img = document.getElementById('fotoGrande');

           
            img.onload = function() {
                
                
                ctx.drawImage(img, 0, 0, 800, 800);

              
                ctx.font = "bold 60px Arial";      
                ctx.fillStyle = "white";           
                ctx.textAlign = "center";          

                

                
                
                
                ctx.fillText("¡Concierto Nará!", 400, 750);
            };

            if (img.complete) {
                img.onload();
            }
        };
    </script>
</body>
</html>
